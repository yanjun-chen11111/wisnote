<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <script>
      // 极简 Streamlit 组件：在浏览器端管理登录令牌（sessionStorage，按标签页隔离）
      //   set   → 写入 sessionStorage
      //   clear → 清空 sessionStorage
      //   任意 method 渲染后都会把当前 sessionStorage 里的令牌回传给 Python（供刷新恢复）
      // 令牌不出现在地址栏、不写入磁盘；刷新保留、关闭标签页/浏览器即失效。
      function onMessage(event) {
        const d = event.data;
        if (!d || d.type !== "streamlit:render") return;
        const a = d.args || {};
        const name = a.name || "wisnote_token";

        if (a.method === "set") {
          try { sessionStorage.setItem(name, a.value || ""); } catch (e) {}
        } else if (a.method === "clear") {
          try { sessionStorage.removeItem(name); } catch (e) {}
        }

        let v = "";
        try { v = sessionStorage.getItem(name) || ""; } catch (e) { v = ""; }
        window.parent.postMessage({ type: "streamlit:setComponentValue", value: v }, "*");
      }

      window.addEventListener("message", onMessage);
      window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");
      window.parent.postMessage({ type: "streamlit:setFrameHeight", height: 0 }, "*");
    </script>
  </body>
</html>
